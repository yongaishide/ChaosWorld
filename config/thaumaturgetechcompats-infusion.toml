		# Default: 0.6
		# Range: 0.0 ~ 1.0
		warp_chance = 0.6
		#Warp given per event, multiplied by the intensity.
		# Default: 2
		# Range: 1 ~ 1000
		warp_amount = 2
		#Chance that the warp is the kind that fades slowly instead of the temporary kind.
		# Default: 0.2
		# Range: 0.0 ~ 1.0
		warp_normal_chance = 0.2
		#Creatures from beyond come through next to the altar.
		summon_enabled = true
		#Chance that an event summons creatures.
		# Default: 0.4
		# Range: 0.0 ~ 1.0
		summon_chance = 0.4
		#Creatures summoned per event, multiplied by the intensity up to three times.
		# Default: 3
