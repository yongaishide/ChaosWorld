[tier_rule]
	#Everything of the Avaritia tiers that is made by infusion can only be infused on an altar whose center is the Runic Matrix of its own tier, so it suffers that matrix's instability. This is the master switch of that rule.
	enabled = true
	#Items of this tier that are made by infusion need the Runic Matrix of this tier at the center of the altar. The matrices and the infusion stones keep following the tier before them.
	require_own_matrix = true

	[matrix.matrix]
		#Multiplier of the stability this matrix loses every cycle. The faster it loses stability, the sooner the instability of the craft in progress starts to trigger events. 1 is the loss of the Runic Matrix.
		# Default: 1.0
		# Range: 0.0 ~ 1000.0
		instability_multiplier = 1.0
		#Every unit of essentia that enters the matrix counts as this many units of the recipe. 1 is what the Runic Matrix does.
		# Default: 1
		# Range: 1 ~ 10000
		essentia_multiplier = 1
		#Turns every instability event of this matrix on or off.
		effects_enabled = true
		#Every this many points of stability below zero add one more level of intensity to the events of this matrix.
		# Default: 25.0
		# Range: 1.0 ~ 1000.0
		intensity_stability_scale = 25.0
		#Radius in blocks around the matrix reached by its instability events.
		# Default: 6
		# Range: 1 ~ 64
		effect_radius = 6
		#Extra multiplier of the instability while it is day. 2 means twice as unstable by day.
		# Default: 2.0
		# Range: 1.0 ~ 100.0
		day_multiplier = 2.0
		#When on, the day multiplier only applies if the matrix can see the sky.
		day_requires_sky = false
		#Solar flares set the ground around the altar on fire.
		fire_enabled = true
		#Chance that an event sets fires.
		# Default: 0.6
		# Range: 0.0 ~ 1.0
		fire_chance = 0.6
		#Fires tried per event, multiplied by the intensity.
		# Default: 4
		# Range: 1 ~ 64
		fire_attempts = 4
		#Solar flares call lightning near the altar.
		lightning_enabled = true
		#Chance that an event calls lightning.
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		lightning_chance = 0.25
		#Solar flares burn everything alive near the altar.
		burn_enabled = true
		#Chance that an event burns the creatures around.
		# Default: 0.7
		# Range: 0.0 ~ 1.0
		burn_chance = 0.7
		#Seconds on fire per event, multiplied by the intensity.
		# Default: 4
		# Range: 1 ~ 600
		burn_seconds = 4
		#Fire damage per event, multiplied by the intensity.
		# Default: 2.0
		# Range: 0.0 ~ 1000.0
		burn_damage = 2.0

	[matrix.neutronium]
		#Multiplier of the stability this matrix loses every cycle. The faster it loses stability, the sooner the instability of the craft in progress starts to trigger events. 1 is the loss of the Runic Matrix.
		# Default: 1.5
		# Range: 0.0 ~ 1000.0
		instability_multiplier = 1.5
		#Every unit of essentia that enters the matrix counts as this many units of the recipe. 1 is what the Runic Matrix does.
		# Default: 1
		# Range: 1 ~ 10000
		essentia_multiplier = 1
		#Turns every instability event of this matrix on or off.
		effects_enabled = true
		#Every this many points of stability below zero add one more level of intensity to the events of this matrix.
		# Default: 25.0
		# Range: 1.0 ~ 1000.0
		intensity_stability_scale = 25.0
		#Radius in blocks around the matrix reached by its instability events.
		# Default: 8
		# Range: 1 ~ 64
		effect_radius = 8
		#The altar gives off radiation that hurts and weakens everything alive near it.
		radiation_enabled = true
		#Chance that an event gives off radiation.
		# Default: 0.8
		# Range: 0.0 ~ 1.0
		radiation_chance = 0.8
		#Radiation damage per event, multiplied by the intensity.
		# Default: 2.0
		# Range: 0.0 ~ 1000.0
		radiation_damage = 2.0
		#Seconds of weakness, hunger and wither per event, multiplied by the intensity.
		# Default: 10
		# Range: 1 ~ 3600
		radiation_effect_seconds = 10
		#The altar can melt down and explode.
		meltdown_enabled = true
		#Chance that an event ends in an explosion.
		# Default: 0.08
		# Range: 0.0 ~ 1.0
		meltdown_chance = 0.08
		#Explosion power, multiplied by the intensity up to three times.
		# Default: 3.0
		# Range: 0.0 ~ 50.0
		meltdown_power = 3.0
		#When off, the explosion hurts but does not break blocks.
		meltdown_breaks_blocks = true
		#The altar pours flux into the aura around it.
		contamination_enabled = true
		#Chance that an event pours flux.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		contamination_chance = 0.5
		#Flux poured per event, multiplied by the intensity.
		# Default: 8.0
		# Range: 0.0 ~ 100000.0
		contamination_flux = 8.0

