		summon_count = 3
		#Ids of the creatures the cosmic instability can summon around the altar.
		summon_entities = ["minecraft:endermite", "minecraft:vex", "minecraft:silverfish"]
		#Everything alive near the altar is thrown somewhere else.
		teleport_enabled = true
		#Chance that an event teleports the creatures around.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		teleport_chance = 0.5
		#Furthest distance in blocks a creature is thrown.
		# Default: 16
		# Range: 1 ~ 256
		teleport_distance = 16

