#AutoEMC - recipe-first EMC generator for items ProjectE leaves unmapped
[general]
	#Master switch. If false, AutoEMC does nothing.
	enabled = true
	#Log every generated EMC entry. Leave false for large modpacks.
	logAddedItems = false
	#Run a fresh AutoEMC scan every server start, ignoring the saved scan signature.
	alwaysRescan = false
	#Automatically run /reload after writing custom_emc.json.
	#Default false; restart instead unless your pack reliably reloads all recipes.
	reloadProjectEAfterWrite = false

#Progress messages. Every status message is always written to latest.log.
#With chatNotifications enabled, the same status is also sent to all online players.
[progress]
	#Show AutoEMC start, skip, progress, warning, and completion messages in Minecraft chat.
	chatNotifications = true
	#How many registry items or recipes AutoEMC processes per server tick.
	#Lower values make startup smoother; higher values finish sooner.
	# Default: 500
	# Range: 1 ~ 5000
	itemsPerTick = 500
	#Send a progress update every N percent. Use 25 for 25%, 50%, 75%, 100%.
	#Only applies in chat when chatVerbosity is set to 2 (verbose).
	# Default: 5
	# Range: 1 ~ 100
	progressUpdatePercent = 5
	#How much detail AutoEMC sends to in-game chat. The full detail is always
	#written to latest.log and config/autoemc/autoemc-debug.log regardless of this setting.
	#0 = minimal: only start, finish, and warnings/errors.
	#1 = normal (default): the above, plus one short update per stage (recommended).
	#2 = verbose: everything, including percent progress and every recipe-solving pass.
	# Default: 1
	# Range: 0 ~ 2
	chatVerbosity = 1
	#Automatically reduce AutoEMC work per tick when the server is busy, then recover when ticks are healthy.
	adaptiveBatchSizing = true
	#Target AutoEMC work time per server tick when adaptiveBatchSizing is enabled.
	# Default: 15.0
	# Range: 0.25 ~ 100.0
	adaptiveBatchTargetMs = 15.0
	#Write a debug-log warning when AutoEMC generates an EMC value at or above this amount.
	#This is only a warning, not a cap. Use 0 to disable.
	# Default: 1000000000000
	# Range: 0 ~ 9223372036854775807
	highEmcWarningThreshold = 1000000000000

#Recipe solving. AutoEMC tries recipes before fallback.
#Only recipes whose ingredients already have EMC can produce a recipe-derived EMC value.
[recipeSolving]
	#Calculate missing EMC values from loaded recipes before using fallback.
	solveRecipes = true
	#Run AutoEMC's ProjectE-style mapper framework before recipe solving.
	#This is where bundled and mod-specific mapper behavior plugs into the solver graph.
	useMapperFramework = true
	#Use bundled ProjectE/ProjectE Integration style conversion mappings as extra recipe edges.
	#These are backported from a ProjectE 1.20.1 mapping dump plus ProjectE Integration custom conversions,
	#and are applied only when matching items/tags exist.
	useBundledProjectEMappingConversions = true
	#Maximum dependency-solving passes.
	# Default: 25
	# Range: 1 ~ 500
	maxRecipePasses = 25
	#For recipe ingredients with multiple matching items: true uses the highest known EMC;
	#false uses the lowest known EMC. False is generally safer.
	allowRecipeValueIncrease = false
	#Safety guard: if fewer recipes than this load, normal fallback does not run.
	#Set to 0 to disable this guard.
	# Default: 50
	# Range: 0 ~ 1000000
	minimumUsableRecipesBeforeFallback = 50
	#Only write full EMC-CONSISTENCY detail when current EMC is at least this many
	#times higher than the recipe-derived EMC. Smaller mismatches are counted in
	#the scan summary without flooding the debug log.
	# Default: 1.1
	# Range: 1.0 ~ 1000000.0
	consistencyWarnMinRatio = 1.1
	#Also write full EMC-CONSISTENCY detail when current EMC exceeds recipe-derived EMC
	#by at least this many EMC, even if the ratio is small. Set to 0 to log every
	#positive mismatch by absolute delta.
	# Default: 1000
	# Range: 0 ~ 9223372036854775807
	consistencyWarnMinAbsoluteDelta = 1000
	#How close a live ProjectE value can be to AutoEMC's last generated value before AutoEMC releases ownership.
	#Example: 1.15 means differences within 15% are treated as normal noise or manual adjustment.
	# Default: 1.15
	# Range: 1.0 ~ 1.7976931348623157E308
	ownershipSmallDifferenceRatio = 1.15
	#Previous AutoEMC value must be at least this high before large-drop protection can block a lower recompute.
	#This prevents tiny normal corrections from being quarantined.
	# Default: 1000000
	# Range: 1 ~ 9223372036854775807
	largeDropProtectionThreshold = 1000000
	#Maximum allowed drop for an AutoEMC-owned value before the old value is kept instead.
	#Example: 50 means a recompute more than 50x lower than the previous value is blocked and reported.
	# Default: 50.0
	# Range: 1.0 ~ 1.7976931348623157E308
	maxAllowedDropRatio = 50.0

#Normal fallback. This is used only when ProjectE and recipe solving both fail.
[normalFallback]
	#Give items that still cannot be recipe-priced a fallback EMC value. Enabled by default.
	useFallbackForUnsolvable = true
	#Use fallback EMC only for missing items with no loaded recipe output, then run recipe solving again.
	#This lets smelting, smithing, crafting, stonecutting, blasting, smoking, campfire,
	#and compatible custom recipes build sensible values from raw/source materials.
	seedFallbackMaterialsForRecipes = true
	#After final fallback values are assigned, reprice each fallback output from every loaded recipe.
	#Only raises a fallback value; it never changes an existing ProjectE value or lowers EMC.
	#Example: eight 64-EMC shards craft into a 512-EMC block.
	postFallbackRecipeUpgrade = true
	# Default: 8
	# Range: 0 ~ 9223372036854775807
	commonBase = 8
	# Default: 64
	# Range: 0 ~ 9223372036854775807
	uncommonBase = 64
	# Default: 512
	# Range: 0 ~ 9223372036854775807
	rareBase = 512
	# Default: 4096
	# Range: 0 ~ 9223372036854775807
	epicBase = 4096
	#Multiplier for items with max stack size 1.
	# Default: 4.0
	# Range: 0.0 ~ 1000.0
	unstackableMultiplier = 4.0
	#Multiplier for items that stack below lowStackThreshold but above 1.
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	lowStackMultiplier = 2.0
	#Maximum stack size that receives lowStackMultiplier.
	# Default: 16
	# Range: 1 ~ 64
	lowStackThreshold = 16
	#Fallback EMC added per point of max durability.
	# Default: 0.75
	# Range: 0.0 ~ 1000.0
	durabilityPerPoint = 0.75
	#Lowest possible normal fallback value.
	# Default: 1
	# Range: 1 ~ 9223372036854775807
	minimumEmc = 1
	#Use Forge item tags before rarity fallback for unknown source materials.
	#This keeps tagged modded ores/gems/ingots/dusts from collapsing to the same value as dirt.
	useForgeTagFallback = true
	#Use bundled values harvested from ProjectE Integration/ProjectE defaults as recipe-solving anchors.
	#These entries seed missing items before recipe solving, and still act as fallback before generic tag values.
	useProjectEIntegrationBaselines = true
	#ProjectE Integration style baseline values. Format: item_or_#tag=value.
	#Examples: allthemodium:allthemodium_ingot=122800 or #forge:ingots/zinc=128.
