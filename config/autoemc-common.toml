	#Material values used with Forge tags like forge:ores/tin, forge:ingots/copper, forge:gems/diamond.
	#Format: material=value. Add aliases as separate entries, e.g. aluminium=256 and aluminum=256.
	tagFallbackMaterials = ["charcoal=32", "coal=128", "sulfur=128", "sulphur=128", "niter=128", "saltpeter=128", "apatite=256", "quartz=256", "certus_quartz=256", "charged_certus_quartz=512", "fluix=512", "fluorite=256", "copper=85", "tin=256", "zinc=256", "aluminum=256", "aluminium=256", "bauxite=256", "lead=512", "silver=512", "nickel=1024", "ferrous=1024", "osmium=1024", "iesnium=4096", "iron=256", "gold=2048", "lapis=864", "redstone=64", "glowstone=384", "diamond=8192", "emerald=8192", "netherite=16384", "steel=512", "bronze=384", "brass=384", "electrum=1280", "invar=768", "constantan=768", "signalum=2048", "lumium=2048", "enderium=4096", "uranium=4096", "yellorium=4096", "cyanite=2048", "platinum=4096", "iridium=8192", "titanium=4096", "tungsten=8192", "tungstensteel=8192", "chrome=4096", "chromium=4096", "cobalt=2048", "ardite=2048", "manyullyn=4096", "mithril=4096", "orichalcum=4096", "adamantite=8192", "cinnabar=512", "ruby=4096", "sapphire=4096", "peridot=4096", "topaz=4096", "amethyst=4096", "carnelian=4096", "malachite=4096", "moonstone=4096", "onyx=4096", "aquamarine=4096", "mana=4096", "bitumen=128", "prosperity=512", "inferium=512", "prudentium=2048", "tertium=8192", "imperium=32768", "supremium=131072", "insanium=524288", "draconium=2048", "awakened_draconium=262144", "allthemodium=122800", "vibranium=1000000000", "unobtainium=1000000000000"]
	#Form multipliers used with Forge material tags.
	#Format: tag_folder=multiplier. Examples: storage_blocks=9, nuggets=0.111111, gears=4.
	tagFallbackForms = ["ores=1.0", "raw_ores=1.0", "raw_materials=1.0", "gems=1.0", "ingots=1.0", "dusts=1.0", "crystals=1.0", "shards=0.25", "clumps=1.0", "clusters=1.0", "chunks=1.0", "pieces=1.0", "nuggets=0.111111", "storage_blocks=9.0", "raw_storage_blocks=9.0", "blocks=9.0", "plates=1.0", "gears=4.0", "rods=0.5", "wires=0.5", "coins=0.111111"]
	#Tag namespaces accepted by material fallback.
	#Forge tags are the normal path, but some mods expose useful material tags under their own namespace.
	tagFallbackNamespaces = ["forge", "mekanism", "create"]
	#Extra multipliers for ore item ids when tag fallback prices an ore.
	#This is a rarity/progression heuristic, not exact worldgen math.
	#Format: item_id_fragment=multiplier. Examples: nether_=1.5, end_=2.0, deepslate_=1.25.
	oreVariantMultipliers = ["deepslate_=1.25", "nether_=1.5", "end_=2.0"]
	#Give creative/no-recipe items exactly 1 EMC.
	#This applies only to items AutoEMC's creative-no-recipe safety bucket would price at 1 EMC.
	#Turn this off to leave those items unpriced instead.
	giveCreativeNoRecipeItemsOneEmc = true
	#Item id fragments that must never receive cheap rarity/tag fallback.
	#Use this for creative, infinite, or endgame-cycle items. NBT variants for these ids are only written when a material resolver prices them.
	#Matching is case-insensitive substring matching against the normalized item id.
	protectedCheapFallbackPatterns = ["creative", "infinity", "allthemodium:_alloy_", "allthemodium:molten_", "allthemodium:vapor_", "draconicadditions:chaos_"]

#Progression tiers. Higher tiers override lower tiers and keep powerful items out of cheap fallback ranges.
[progressionTiers]
	strongNamespaces = ["allthemodium"]
	strongItems = ["allthemodium:allthemodium_helmet", "allthemodium:allthemodium_chestplate", "allthemodium:allthemodium_leggings", "allthemodium:allthemodium_boots"]
	strongKeywords = ["allthemodium", "wyvern"]
	# Default: 1000000
	# Range: 1 ~ 9223372036854775807
	strongMinimumEmc = 1000000
	# Default: 999999999
	# Range: 1 ~ 9223372036854775807
	strongMaximumFallbackEmc = 999999999
	veryStrongNamespaces = []
	veryStrongItems = []
	veryStrongKeywords = ["vibranium", "draconic", "draconium", "awakened"]
	# Default: 1000000000
	# Range: 1 ~ 9223372036854775807
	veryStrongMinimumEmc = 1000000000
	# Default: 999999999999
	# Range: 1 ~ 9223372036854775807
	veryStrongMaximumFallbackEmc = 999999999999
	opNamespaces = []
	opItems = []
	opKeywords = ["chaos", "chaotic", "chaot", "infin", "inifin", "infiniet", "creative", "creativ", "unobtainium"]
	# Default: 1000000000000
	# Range: 1 ~ 9223372036854775807
	opMinimumEmc = 1000000000000
	# Default: 9000000000000000
	# Range: 1 ~ 9223372036854775807
	opMaximumFallbackEmc = 9000000000000000

#Optional NBT fallback pass. Recipe solving uses normal item IDs.
#NBT scanning uses variants exposed by each item's creative tab listing.
[nbt]
	#Include NBT-distinct fallback entries such as potions, enchanted books, and material-tagged items.
	scanNbtVariants = false
	#Legacy alias for scanNbtVariants. Kept for old configs; prefer scanNbtVariants.
	runNbtPassAfterBasicPass = false
	#Maximum creative-tab NBT variants AutoEMC will write for one item id.
	#Prevents buggy or combinatorial item variant lists from bloating custom_emc.json.
	# Default: 64
	# Range: 1 ~ 4096
	maxNbtVariantsPerItem = 64
	#Use mod-specific NBT material resolvers before plain tag/rarity fallback.
	#This lets one item id with material NBT, such as Avaritia singularities, get material-specific EMC.
	useNbtMaterialResolvers = true
	#Register AutoEMC's NBT material resolvers with ProjectE's live NBT value processor.
	#This lets supported tagged stacks resolve on demand when ProjectE asks for their EMC.
	useLiveNbtMaterialResolution = true
	#Tiny base EMC value seeded for supported NBT material item ids so ProjectE calls the live NBT processor.
	#The live processor replaces this value for tagged stacks and does not override higher exact values.
	# Default: 1
	# Range: 1 ~ 9223372036854775807
	liveNbtResolverSeedValue = 1
	#NBT material resolver multipliers. Format: resolver_id=multiplier.
	#Example: avaritia_singularity=512 prices singularities as 512 of the resolved material.
	nbtMaterialMultipliers = ["avaritia_singularity=512.0"]
