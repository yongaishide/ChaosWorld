# Machine and network component settings.
# 机器与网络组件设置。
machines:
  # Data Ripper power and target selection.
  # 数据撕裂器的功耗与目标选择设置。
  dataRipper:
    # Base power cost for the data ripper power curve.
    # 数据撕裂器功耗曲线的基础数据流消耗。
    baseCost: 512

    # Regex patterns for block ids that the data ripper should never accelerate.
    # 数据撕裂器永远不会加速的方块 ID 正则表达式。
    blacklist:

    # Power multipliers paired by array index.
    # 按数组索引配对的功耗倍率。
    multipliers:
      # Block id regex patterns. Each index pairs with the value at the same index.
      # 方块 ID 正则表达式；每项与 values 中相同索引的倍率配对。
      patterns:
        - minecraft:hopper
        - appeng:.*

      # Positive power multipliers paired with patterns by index.
      # 与 patterns 按索引配对的正功耗倍率。
      values:
        - 1.5
        - 2.0

  # Data Distribution Tower chunk coverage.
  # 数据分配塔的区块覆盖设置。
  dataDistributionTower:
    # Base chunk coverage level. 1=1x1 chunk, 2=3x3 chunks, and so on.
    # 基础区块覆盖等级。1=1x1 区块，2=3x3 区块，依此类推。
    range: 1

  # Data Extractor work and carrier requirements.
  # 数据提取器的工作与载体需求设置。
  dataExtractor:
    # Base damage dealt each cycle.
    # 每次工作造成的基础伤害。
    baseDamage: 5

    # Seconds between work cycles before speed cards.
    # 速度卡生效前每次工作之间的秒数。
    workIntervalSeconds: 5

    # Base data flow generated per cycle.
    # 每次工作生成的基础数据流。
    baseDataFlowPerCycle: 100

    # Additional data flow per point of sword or base damage.
    # 每点剑或基础伤害额外生成的数据流。
    dataFlowPerSwordDamage: 20

    # Base maximum number of affected targets.
    # 可影响目标数量的基础上限。
    baseTargetLimit: 20

    # Additional target limit per capacity card.
    # 每张容量卡提供的额外目标上限。
    targetLimitPerCapacityCard: 5

    # Additional data flow multiplier per extra target.
    # 每个额外目标提供的数据流倍率加成。
    extraTargetDataFlowMultiplier: 0.25

    # Required total damage for a mob data carrier.
    # 完成生物数据载体所需的总伤害。
    mobRequiredDamage: 1024.0

    # Blocked entity ids. Each array element is one registry id.
    # 禁用的实体 ID；每个数组元素对应一个注册表 ID。
    mobDataBlacklist:

    # Required total amount for an ore data carrier.
    # 完成矿石数据载体所需的总数量。
    oreRequiredAmount: 4096.0

    # Blocked item ids for ore data. Each array element is one registry id.
    # 矿物数据禁用的物品 ID；每个数组元素对应一个注册表 ID。
    oreDataBlacklist:

    # Required total amount for a crop data carrier.
    # 完成农作数据载体所需的总数量。
    cropRequiredAmount: 4096.0

    # Blocked item ids for crop data. Each array element is one registry id.
    # 农作数据禁用的物品 ID；每个数组元素对应一个注册表 ID。
    cropDataBlacklist:

    # Additional allowed crop item ids. Each array element is one registry id.
    # 额外允许的农作物品 ID；每个数组元素对应一个注册表 ID。
    cropDataWhitelist:

  # Solar generation and upgrade bonuses.
  # 太阳能发电与升级加成设置。
  solarPanel:
    # Daytime AE generation per tick.
    # 白天每 tick 生成的 AE。
    dayGenerationAEPerTick: 3000.0

    # Nighttime AE generation per tick.
    # 夜晚每 tick 生成的 AE。
    nightGenerationAEPerTick: 1000.0

    # Additional generation ratio per speed card.
    # 每张速度卡提供的额外发电倍率。
    speedCardBonusRatio: 0.75

    # Additional AE storage per energy card.
    # 每张能量卡提供的额外 AE 存储容量。
    energyCardCapacityBonusAE: 80000.0

# Explosive and terrain transformation settings.
# 爆炸物与地形变换设置。
explosives:
  # Configurable TNT terrain replacement.
  # 可配置 TNT 的地形替换设置。
  flatteningTnt:
    # Chunk radius for the cleared area. 1 = 3x3 chunks.
    # 清除区域的区块半径。1 = 3x3 区块。
    clearChunkRadius: 1

    # Vertical offset where clearing starts.
    # 清除起始位置的垂直偏移。
    clearStartYOffset: 0

    # Number of vertical blocks to clear.
    # 要清除的垂直方块数量。
    clearHeight: 25

    # Chunk radius for the filled floor. 1 = 3x3 chunks.
    # 填充地板的区块半径。1 = 3x3 区块。
    fillChunkRadius: 1

    # Vertical offset for the filled floor layer.
    # 填充地板层的垂直偏移。
    fillYOffset: -1

    # Block id used for the filled floor.
    # 用于填充地板的方块 ID。
    fillBlock: minecraft:dirt

    # X offset applied to the TNT center.
    # 应用到 TNT 中心的 X 偏移。
    centerOffsetX: 0

    # Y offset applied to the TNT center.
    # 应用到 TNT 中心的 Y 偏移。
    centerOffsetY: 0

    # Z offset applied to the TNT center.
    # 应用到 TNT 中心的 Z 偏移。
    centerOffsetZ: 0

    # Preserve water and lava while clearing.
    # 清除时保留水和岩浆。
    preserveFluids: false

    # Allow unbreakable blocks to be removed or replaced.
    # 允许移除或替换不可破坏方块。
    replaceUnbreakableBlocks: false

  # Incremental Data Nuke consumption.
  # 数据核弹的渐进吞噬设置。
  dataNuke:
    # Server ticks between block-devouring cycles.
    # 吞噬方块工作周期之间的服务器 tick。
    workIntervalTicks: 1

    # Maximum spherical radius in blocks.
    # 最大球形半径，单位方块。
    maxRadius: 2048

    # Entity-devouring radius checked every tick.
    # 每 tick 检查的实体吞噬半径。
    centerEntityConsumeRadius: 4.0

# Astronomy production and dimension multipliers.
# 天文观测产出与维度倍率设置。
astronomy:
  # Stellar Flux produced per clear-weather tick by one low-tier observatory.
  # 单个低阶天文观测台在晴朗天气下每 tick 产出的耀星流。
  lowTierStellarFluxPerTick: 8

  # AE energy consumed by one successful low-tier observation tick.
  # 低阶天文观测台每次成功观测 tick 消耗的 AE 能量。
  lowTierAeEnergyPerTick: 4000

  # Stellar Flux produced per tick by each valid high-tier mirror from mirror 1 through 4.
  # 高阶阵列第 1 至 4 个有效镜单元各自每 tick 产出的耀星流。
  highTierMirrorStellarFluxPerTick1To4: 40

  # Stellar Flux produced per tick by each valid high-tier mirror from mirror 5 through 8.
  # 高阶阵列第 5 至 8 个有效镜单元各自每 tick 产出的耀星流。
  highTierMirrorStellarFluxPerTick5To8: 30

  # Stellar Flux produced per tick by each valid high-tier mirror from mirror 9 through 12.
  # 高阶阵列第 9 至 12 个有效镜单元各自每 tick 产出的耀星流。
  highTierMirrorStellarFluxPerTick9To12: 20

  # Stellar Flux produced per tick by each valid high-tier mirror from mirror 13 through 16.
  # 高阶阵列第 13 至 16 个有效镜单元各自每 tick 产出的耀星流。
  highTierMirrorStellarFluxPerTick13To16: 10

  # Fixed AE energy consumed per successful high-tier array tick.
  # 高阶阵列每次成功工作 tick 固定消耗的 AE 能量。
  highTierCoreAeEnergyPerTick: 25000

  # Additional AE energy consumed per valid high-tier mirror and successful tick.
  # 高阶阵列每个有效镜单元在每次成功工作 tick 额外消耗的 AE 能量。
  highTierMirrorAeEnergyPerTick: 10000

  # Minimum valid mirrors required to operate.
  # 高阶阵列开始工作所需的最少有效镜单元数。
  highTierMinimumMirrors: 4

  # Maximum mirrors claimed and used by one core.
  # 单个高阶阵列核心可绑定并使用的最大镜单元数。
  highTierMaximumMirrors: 16

  # Maximum horizontal distance from a high-tier core to a mirror center.
  # 高阶阵列核心到镜单元中心的最大水平距离。
  highTierMirrorHorizontalRange: 32

  # Maximum absolute height difference from a high-tier core to a mirror center.
  # 高阶阵列核心到镜单元中心允许的最大高度差。
  highTierMirrorVerticalRange: 4

  # Maximum waveguide path length from a high-tier core port to a mirror.
  # 高阶阵列核心端口到镜单元的最大星能波导路径长度。
  highTierWaveguidePathLength: 32

  # Output multiplier while raining.
  # 降雨时的产出倍率。
  rainOutputMultiplier: 0.25

  # Inclusive observation-window start within a 24,000-tick day.
  # 普通昼夜维度在 24000 tick 周期内的观测窗口起始值（包含）。
  observationWindowStartTick: 13000

  # Exclusive observation-window end within a 24,000-tick day.
  # 普通昼夜维度在 24000 tick 周期内的观测窗口结束值（不包含）。
  observationWindowEndTick: 23000

  # Output multiplier for tagged observable dimensions without an explicit override.
  # 未显式覆盖的可观测维度使用的产出倍率。
  defaultDimensionMultiplier: 1.0

  # Dimension ids paired by index with dimensionMultiplierValues.
  # 与 dimensionMultiplierValues 按索引配对的维度 ID。
  dimensionIds:
    - minecraft:overworld
    - minecraft:the_end
    - minecraft:the_nether

  # Per-dimension output multipliers paired by index with dimensionIds.
  # 与 dimensionIds 按索引配对的维度产出倍率。
  dimensionMultiplierValues:
    - 1.0
    - 2.0
    - 0.0

# Orbital weapon reserves, deployment and endpoint limits.
# 轨道武器储备、部署与端点限制。
stellarErasureDevice:
  # Maximum orbital Stellar Flux reserve.
  # 轨道耀星流储备上限。
  stellarFluxCapacity: 500000000

  # Maximum orbital AE energy reserve, separate from Stellar Flux.
  # 轨道 AE 能量储备上限，与耀星流相互独立。
  aeEnergyCapacity: 500000000000

  # Stellar Flux consumed per deployed tick.
  # 部署状态每 tick 消耗的耀星流。
  stellarFluxUpkeepPerTick: 100

  # AE energy consumed per deployed tick.
  # 部署状态每 tick 消耗的 AE 能量。
  aeEnergyUpkeepPerTick: 250000

  # Maximum Stellar Flux transferred by one endpoint per tick.
  # 单个端点每 tick 可传输的耀星流上限。
  stellarFluxChargePerTick: 20000

  # Maximum AE energy transferred by one endpoint per tick.
  # 单个端点每 tick 可传输的 AE 能量上限。
  aeEnergyChargePerTick: 10000000

  # Ticks at zero reserve before returning to dormancy.
  # 储备归零后返回休眠状态前的宽限 tick 数。
  reserveGraceTicks: 12000

  # Fraction of both reserve capacities required to deploy.
  # 开始部署所需的两种储备容量比例。
  deploymentThreshold: 0.1

  # Ticks spent tearing down and rebuilding after changing the primary uplink beacon.
  # 切换主上行信标后拆解并重组投影所需的 tick 数。
  redeploymentTicks: 1200

  # Maximum control consoles and uplink beacons bound to one weapon.
  # 单件武器可绑定的控制终端与上行信标总上限。
  maxEndpointsPerWeapon: 32

  # Maximum endpoints for one weapon in a single dimension.
  # 单件武器在同一维度内的端点上限。
  maxEndpointsPerDimension: 8

  # Keep each bound endpoint chunk loaded.
  # 让每个已绑定端点强制加载自身区块。
  endpointChunkLoadingEnabled: true

  # Maximum attack work chunk tickets held by one task.
  # 单个攻击任务同时持有的工作区块票据上限。
  maxAttackChunkTicketsPerTask: 8

  # Maximum attack work chunk tickets held across the server.
  # 全服攻击工作区块票据总上限。
  maxAttackChunkTicketsGlobal: 64

  # Maximum concurrent attack chunk requests per dimension.
  # 每个维度同时执行的攻击区块请求上限。
  maxAttackChunkGenerationPerDimension: 2

  # Maximum concurrent attack chunk requests across the server.
  # 全服同时执行的攻击区块请求上限。
  maxAttackChunkGenerationGlobal: 8

  # Maximum terrain positions visited by one attack per tick.
  # 单个攻击任务每 tick 访问的地形位置上限。
  maxAttackBlockMutationsPerTaskTick: 8192

  # Maximum terrain positions visited by all orbital attacks per tick.
  # 全服轨道攻击每 tick 访问的地形位置总上限。
  maxAttackBlockMutationsGlobalTick: 32768

  # Maximum preview chunk cells checked by one player per tick.
  # 单名玩家的攻击预览每 tick 检查的区块单元上限。
  previewChunkChecksPerTaskTick: 4096

  # Maximum preview chunk cells checked across the server per tick.
  # 全服攻击预览每 tick 检查的区块单元总上限。
  previewChunkChecksGlobalTick: 16384

  # Maximum warning, committed and delivering orbital attack tasks.
  # 全服预警、已提交和投送中的轨道攻击任务上限。
  maxCommittedAttackTasks: 32

  # Allow new kinetic attack confirmations. Existing attacks continue.
  # 允许确认新的动能攻击。已开始的攻击继续执行。
  kineticAttackEnabled: true

  # Allow new directed-energy attack confirmations. Existing attacks continue.
  # 允许确认新的定向能攻击。已开始的攻击继续执行。
  directedEnergyAttackEnabled: true

  # Allow new digital-annihilation attack confirmations. Existing attacks continue.
  # 允许确认新的数位湮灭攻击。已开始的攻击继续执行。
  digitalAnnihilationAttackEnabled: true

  # Radius of the kinetic strike's vertical clearing column.
  # 动能攻击垂直清除柱的半径。
  kineticColumnRadius: 8

  # Blocks cleared below the kinetic target by its vertical column.
  # 动能攻击垂直清除柱向目标下方延伸的深度。
  kineticColumnDepth: 192

  # Radius of the shallow crater below a kinetic impact.
  # 动能攻击命中点下方浅陨坑的半径。
  kineticCraterRadius: 64

  # Maximum depth of the bowl-shaped crater below a kinetic impact.
  # 动能攻击命中点下方碗状陨石坑的最大深度。
  kineticCraterDepth: 32

  # Radius of the instantaneous kinetic impact shockwave.
  # 动能攻击瞬时冲击波的半径。
  kineticShockwaveRadius: 64

  # Stellar Flux reserved by one kinetic strike.
  # 一次动能攻击预留的耀星流。
  kineticStellarFluxCost: 5000000

  # AE energy reserved by one kinetic strike.
  # 一次动能攻击预留的 AE 能量。
  kineticAeEnergyCost: 5000000000

  # Public warning duration before an attack commits.
  # 攻击提交前的公开预警时长。
  attackWarningTicks: 300

  # Kinetic strike cooldown after its effect completes; zero disables cooldown.
  # 动能攻击效果完成后的冷却时长；设为零时无冷却。
  kineticCooldownTicks: 0

  # Minimum selectable directed-energy scan radius.
  # 定向能扫描可选的最小半径。
  directedEnergyMinimumRadius: 16

  # Maximum selectable directed-energy scan radius.
  # 定向能扫描可选的最大半径。
  directedEnergyMaximumRadius: 256

  # Radius increment measured from the configured directed-energy minimum.
  # 从定向能最小半径开始计算的半径步进。
  directedEnergyRadiusStep: 16

  # Captured block depth of the shallow directed-energy profile.
  # 定向能浅层档冻结的方块深度。
  directedEnergyShallowDepth: 32

  # Captured block depth of the medium directed-energy profile.
  # 定向能中层档冻结的方块深度。
  directedEnergyMediumDepth: 128

  # Captured block depth of the deep directed-energy profile.
  # 定向能深层档冻结的方块深度。
  directedEnergyDeepDepth: 512

  # Fixed Stellar Flux base escrow for one directed-energy scan.
  # 一次定向能扫描固定预留的耀星流基础费用。
  directedEnergyBaseStellarFluxCost: 2000000

  # Fixed AE base escrow for one directed-energy scan.
  # 一次定向能扫描固定预留的 AE 基础费用。
  directedEnergyBaseAeEnergyCost: 2000000000

  # Stellar Flux escrow per directed-energy disk coordinate.
  # 定向能扫描每个圆盘调度坐标的耀星流费用。
  directedEnergyStellarFluxPerCoordinate: 4

  # AE escrow per directed-energy disk coordinate.
  # 定向能扫描每个圆盘调度坐标的 AE 能量费用。
  directedEnergyAeEnergyPerCoordinate: 2000

  # Directed-energy cooldown after its scan completes.
  # 定向能扫描完成后的冷却时长。
  directedEnergyCooldownTicks: 100

  # Stellar Flux reserved by one digital annihilation payload.
  # 一次数位湮灭体轨道载荷预留的耀星流。
  digitalAnnihilationStellarFluxCost: 80000000

  # AE energy reserved by one digital annihilation payload.
  # 一次数位湮灭体轨道载荷预留的 AE 能量。
  digitalAnnihilationAeEnergyCost: 80000000000

  # Digital annihilation cooldown after its payload completes.
  # 数位湮灭体载荷完成后的冷却时长。
  digitalAnnihilationCooldownTicks: 72000

# Trinity planning and dispatch settings.
# 三位一体规划与派发设置。
trinity:
  # Trinity planning limits and quantity semantics.
  # 三位一体规划限制与数量语义设置。
  crafting:
    # Maximum AEKey count in one strongly connected component.
    # 单个强连通分量允许的最大 AEKey 数量。
    maxSccKeys: 64

    # Maximum deduplicated input-binding variants materialized for one request.
    # 单次请求允许物化的最大去重输入绑定变体总数。
    maxBindingVariants: 32768

    # Maximum compressed states for each independent route search or cyclic component.
    # 每个独立路线搜索或循环分量允许的最大压缩状态数。
    maxScheduleStates: 500000

    # Shared time budget for background planning in milliseconds, including compilation, route search and diagnostics. Stops at a verified executable plan or the budget; no unbounded retry. Does not limit server-thread input capture.
    # 后台规划共享的总时间预算，单位毫秒，包含结构编译、路线搜索和诊断。找到并验证可执行方案后返回，到期停止，不要求最优解，也不启动不限时重试。服务端输入捕获不计入此预算。
    planningBudgetMs: 30000

    # Per-tick graph rebuild budget in milliseconds.
    # 每 tick 合成图重建预算，单位毫秒。
    graphRebuildBudgetMs: 4

    # Bounded workers for initial Trinity plan calculations. Default: clamp(CPU / 2, 1, 8). Requires a game restart.
    # Trinity 初始计划计算的有界工作线程数。默认：clamp(CPU / 2, 1, 8)。需要重启游戏。
    plannerThreads: 8

    # Bounded workers for Trinity CPU remaining-work replanning. Default: clamp(CPU / 2, 1, 8). Requires a game restart.
    # Trinity CPU 剩余工作重规划的有界工作线程数。默认：clamp(CPU / 2, 1, 8)。需要重启游戏。
    cpuPlannerThreads: 8

    # Maximum queued requests per planning lane. Requires a game restart.
    # 每条规划轨道允许排队的最大请求数。需要重启游戏。
    plannerQueueCapacity: 128

    # Maximum dynamic-input retry backoff in ticks.
    # 动态输入重试退避的最大 tick 间隔。
    dynamicRetryMaxTicks: 200

    # Default quantity semantics for non-player requests.
    # 非玩家请求使用的默认数量语义。
    # Allowed values:
    # - NET_NEW
    # - FINAL_TOTAL
    defaultQuantityMode: NET_NEW

  # Trinity dispatch governor tuning.
  # 三位一体派发调节器设置。
  dispatch:
    # Maximum physical provider attempts per grid tick.
    # 每个网格每 tick 的最大 provider 物理调用次数。
    hardGridAttempts: 32768

    # Maximum attempts per provider and grid tick.
    # 单个 provider 每个网格 tick 的最大调用次数。
    hardProviderAttempts: 32768

    # Maximum dispatch commit time per grid tick in milliseconds.
    # 每个网格 tick 的派发提交时间上限，单位毫秒。
    hardCommitBudgetMs: 30

    # SAFE-mode grid attempts per tick.
    # SAFE 模式每个网格每 tick 的调用次数。
    safeGridAttempts: 16

    # SAFE-mode attempts per provider and grid tick.
    # SAFE 模式单个 provider 每个网格 tick 的调用次数。
    safeProviderAttempts: 2

    # SAFE-mode commit budget in milliseconds.
    # SAFE 模式提交预算，单位毫秒。
    safeCommitBudgetMs: 2

    # Outstanding proposal permits retained by SAFE mode.
    # SAFE 模式保留的 outstanding proposal permit 数量。
    safeActorPermits: 1

    # Maximum adaptive and SAFE retry backoff in ticks.
    # 自适应及 SAFE 重试退避上限，单位 tick。
    safeRetryBackoffTicks: 8

    # Observation ticks before adaptive decisions.
    # 允许自适应决策前的观察 tick 数。
    warmupTicks: 200

    # Ticks aggregated into one metrics window.
    # 每个指标窗口聚合的 tick 数。
    metricsWindowTicks: 20

    # EWMA alpha for complete server tick duration.
    # 完整服务器 tick 耗时使用的 EWMA alpha。
    ewmaAlpha: 0.25

    # Consecutive windows required for a transition.
    # 状态切换前要求连续满足条件的窗口数。
    transitionWindows: 3

    # Cooldown ticks after a budget adjustment.
    # 预算调整后的 cooldown tick 数。
    cooldownTicks: 60

    # Ticks retained in SAFE mode before observation.
    # SAFE 模式返回观察状态前保持的 tick 数。
    safeHoldTicks: 200

# Developer and diagnostic settings.
# 开发者与诊断设置。
developer:
  # Enable packaged crafting operation failure logs.
  # 启用封包合成任务失败日志。
  packagedCraftingLogging: false

  # Enable high-frequency Trinity planning logs.
  # 启用高频三位一体规划日志。
  trinityPlanningLogging: false

  # Enable high-frequency Trinity dispatch logs.
  # 启用高频三位一体派发日志。
  trinityDispatchLogging: false

  # Enable Data Distribution Tower runtime logs.
  # 启用数据分配塔运行时日志。
  dataDistributionTowerLogging: false

  # Enable AE2 crafting service runtime logs.
  # 启用 AE2 合成服务运行时日志。
  craftingServiceLogging: false

  # Enable powered tool runtime logs.
  # 启用能量工具运行时日志。
