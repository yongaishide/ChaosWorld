# Output rule columns. Values at the same array index form one output stack row.
# 输出规则列；各数组中相同索引的值组成一行输出。
outputRules:
  # Recorded data type for each output row. All output arrays must have the same length.
  # 每个输出行记录的数据类型；所有输出数组的长度必须相同。
  # Allowed values:
  # - MOB
  # - ORE
  # - CROP
  dataTypes:
    - CROP
    - CROP
    - CROP
    - CROP
    - ORE

  # Recorded item registry id for each output row.
  # 每个输出行记录的物品注册表 ID。
  recordedItems:
    - minecraft:oak_sapling
    - minecraft:oak_sapling
    - minecraft:oak_sapling
    - minecraft:oak_sapling
    - minecraft:gold_ore

  # Output item registry id. Repeat data type and recorded item to add another stack to the same rule.
  # 输出物品注册表 ID；重复数据类型和记录物品即可为同一规则增加另一组输出。
  items:
    - minecraft:oak_log
    - minecraft:oak_leaves
    - minecraft:stick
    - minecraft:apple
    - minecraft:gold_ore

  # Positive output count for each row.
  # 每个输出行的正整数数量。
