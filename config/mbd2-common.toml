#Whether to search for recipes asynchronously where the recipe index cannot help: recipe logics whose
#searchRecipe() or recipe type's searchRecipe() an addon overrides, and logics polling inputs the index
#cannot read (an ME interface, say). Other recipe logics search through the index, on the server thread.
asyncRecipeSearching = true
#Whether use vbo for preview page rendering.
useVBO = true
#Duration of the multiblock in-world preview (s)
# Default: 10
# Range: 1 ~ 999
multiblockPreviewDuration = 10
#Duration of the multiblock in-world pattern error position (s)
# Default: 10
# Range: 1 ~ 999
multiblockPatternErrorPosDuration = 10
