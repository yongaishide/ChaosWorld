[client]
	#是否显示样板编码玩家
	#开启后将在样板 HoverText 上添加样板的编码玩家
	showEncoderPatternPlayer = true
	#样板终端默认是否显示槽位
	#影响进入界面时SlotsRow的默认可见性，仅影响客户端显示
	patternTerminalShowSlotsDefault = true
	#JEI / EMI 中是否显示 AE2 网络库存与可合成状态
	#JEI 可通过左下角按钮即时切换；EMI 侧修改本配置
	jeiNetworkOverlayEnabled = true
	#扩展样板供应器是否显示倍率调整按钮
	#可通过扩展样板供应器左侧工具栏即时切换
	extendedPatternProviderShowScalingControls = true

[patternAutoUpload]
	#是否允许编码后自动上传样板到 ECO 合成系统（仅当 NeoECOAE 模组存在时生效）
	#关闭后自动上传只会写入装配矩阵，ECO 合成系统不再参与
	#客户端偏好：随编码动作上报，多人游戏中每个玩家各自生效
	#默认: true
	ecoAutoUploadEnable = true
	#编码后自动上传的目标优先级
	#MATRIX：优先写入装配矩阵，矩阵不可用时回退到 ECO 合成系统
	#ECO：优先写入 ECO 合成系统，ECO 不可用时回退到装配矩阵
	#自动上传每次只向一个目标写入样板，优先目标接受后即结束
	#客户端偏好：随编码动作上报，多人游戏中每个玩家各自生效
	#默认: MATRIX
	#Allowed Values: MATRIX, ECO
	uploadPriority = "MATRIX"
	#编码后若供应器按搜索词唯一匹配，是否直接上传到该供应器
	#优先于矩阵/ECO 自动上传；未命中唯一匹配时按 uploadPriority 回退
	#处理样板只可能走供应器直传，不受 uploadPriority 影响
	#客户端偏好：在客户端判定，多人游戏中每个玩家各自生效
	#默认: true
	uniqueProviderAutoUploadEnable = true
