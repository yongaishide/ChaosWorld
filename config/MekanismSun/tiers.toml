#Settings for configuring Bins
[bins]
	#The number of items Supernova bins can store.
	# Default: 2097152
	# Range: > 1
	supernovaStorage = 2097152

#Settings for configuring Induction Cells and Providers
[induction]
	#Maximum number of Joules Supernova induction cells can store.
	# Default: 32768000000000
	# Range: 1 ~ 9223372036854775807
	supernovaStorage = 32768000000000
	#Maximum number of Joules Supernova induction providers can output or accept.
	# Default: 1048576000
	# Range: 1 ~ 9223372036854775807
	supernovaOutput = 1048576000

#Settings for configuring Energy Cubes
[energy_cubes]
	#Maximum number of Joules Supernova energy cubes can store.
	# Default: 1024000000
	# Range: 1 ~ 9223372036854775807
	supernovaStorage = 1024000000
	#Output rate in Joules of Supernova energy cubes.
	# Default: 1024000
	# Range: 1 ~ 9223372036854775807
	supernovaOutput = 1024000

#Settings for configuring Fluid Tanks
[fluid_tanks]
	#Storage size of Supernova fluid tanks in mB.
	# Default: 4096000
	# Range: > 1
	supernovaStorage = 4096000
	#Output rate of Supernova fluid tanks in mB.
	# Default: 2048000
	# Range: > 1
	supernovaOutput = 2048000

#Settings for configuring Chemical Tanks
[chemical_tanks]
	#Storage size of Supernova chemical tanks in mB.
	# Default: 65536000
	# Range: 1 ~ 9223372036854775807
	supernovaStorage = 65536000
	#Output rate of Supernova chemical tanks in mB.
	# Default: 32768000
	# Range: 1 ~ 9223372036854775807
	supernovaOutput = 32768000

#Settings for configuring Transmitters
[transmitters]

	#Settings for configuring Universal Cables
	[transmitters.energy]
		#Internal buffer in Joules of Supernova Universal Cable.
		# Default: 65536000
		# Range: 1 ~ 9223372036854775807
		absoluteCapacity = 65536000

	#Settings for configuring Mechanical Pipes
	[transmitters.fluid]
		#Capacity of Supernova Mechanical Pipe in mb.
		# Default: 1024000
		# Range: 1 ~ 9223372036854775807
		absoluteCapacity = 1024000
		#Pump rate of Supernova Mechanical Pipe in mb.
		# Default: 256000
		# Range: 1 ~ 2147483647
		absolutePullAmount = 256000

	#Settings for configuring Pressurized Tubes
	[transmitters.chemical]
		#Capacity of Supernova Pressurized Tube in mb.
		# Default: 8192000
		# Range: 1 ~ 9223372036854775807
		absoluteCapacity = 8192000
		#Pump rate of Supernova Pressurized Tube in mb.
		# Default: 2048000
		# Range: 1 ~ 9223372036854775807
		absolutePullAmount = 2048000

	#Settings for configuring Logistical Transporters
	[transmitters.item]
		#Five times the travel speed in m/s of Supernova Logistical Transporter.
		# Default: 55
		# Range: 1 ~ 2147483647
		absoluteSpeed = 55
		#Item throughput rate of Supernova Logistical Transporter in items/half second.
		# Default: 128
		# Range: 1 ~ 2147483647
		absolutePullAmount = 128

	#Settings for configuring Thermodynamic Conductors
	[transmitters.heat]
		#Conduction value of Supernova Thermodynamic Conductor.
		# Default: 10
		# Range: 1 ~ 9223372036854775807
		absoluteConduction = 10
		#Heat capacity of Supernova Thermodynamic Conductor.
		# Default: 1
		# Range: 1 ~ 9223372036854775807
		absoluteCapacity = 1
		#Insulation value of Supernova Thermodynamic Conductor.
		# Default: 400000
		# Range: 1 ~ 9223372036854775807
		absoluteInsulation = 400000
