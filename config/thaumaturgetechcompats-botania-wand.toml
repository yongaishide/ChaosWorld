	[rods.livingwood]
		#Vis capacity of the rod, in the same units as the rods of Thaumaturge. A wooden rod has 25, a greatwood rod 50 and a silverwood rod 100.
		# Default: 60
		# Range: 1 ~ 10000000
		capacity = 60
		#Craft cost factor of the rod. The vis an assembled wand costs to make is this times the craft cost of its cap.
		# Default: 6
		# Range: 1 ~ 100000
		craft_cost = 6

