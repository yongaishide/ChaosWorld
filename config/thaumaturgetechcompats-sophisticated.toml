[stack_upgrades]
	#How many stack upgrades of any kind, the ones of Sophisticated included, a storage accepts. Sophisticated Backpacks and Sophisticated Storage use 3 by default. Needs a game restart.
	# Default: 3
	# Range: 1 ~ 64
	max_per_storage = 3

	[stack_upgrades.thaumium]
		#Times the number of items that fit in one slot. The Stack Upgrade Tier 4 of Sophisticated Backpacks multiplies by 16 and the Stack Upgrade Tier 5 of Sophisticated Storage by 32. Needs a game restart.
		# Default: 8.0E12
		# Range: 1.0 ~ 1.0E15
		multiplier = 8.0E12

	[stack_upgrades.alchemical_brass]
		#Times the number of items that fit in one slot. The Stack Upgrade Tier 4 of Sophisticated Backpacks multiplies by 16 and the Stack Upgrade Tier 5 of Sophisticated Storage by 32. Needs a game restart.
		# Default: 1.6E13
		# Range: 1.0 ~ 1.0E15
		multiplier = 1.6E13

	[stack_upgrades.void_metal]
		#Times the number of items that fit in one slot. The Stack Upgrade Tier 4 of Sophisticated Backpacks multiplies by 16 and the Stack Upgrade Tier 5 of Sophisticated Storage by 32. Needs a game restart.
		# Default: 3.2E13
		# Range: 1.0 ~ 1.0E15
		multiplier = 3.2E13

[arcane_workbench_upgrade]
	#Chunks around the chunk of the player that the upgrade may also draw vis from after the chunk of the player has run dry. 0 draws only from the chunk of the player.
	# Default: 0
	# Range: 0 ~ 2
	aura_chunk_radius = 0
	#Whether a wand in the wand slot of the upgrade pays the vis of the crafts and applies its discount, like the wand in the Arcane Workbench.
	wand_slot_enabled = true
	#Whether a workbench charger item in the charger slot of the upgrade gives its vis discount and vis radius to the crafts of the upgrade.
	charger_slot_enabled = true
	#Radius in chunks around the player from which the Arcane Workbench Charger of Thaumaturge draws vis when it is in the charger slot. The charger beside a workbench uses 1.
	# Default: 1
	# Range: 1 ~ 8
	thaumaturge_charger_radius_chunks = 1
	#Percentage of the vis cost that the Arcane Workbench Charger of Thaumaturge does not charge when it is in the charger slot.
	# Default: 0
	# Range: 0 ~ 100
	thaumaturge_charger_discount_percent = 0

	[backpacks.thaumium]
		#Number of inventory slots in the backpack. The Netherite Backpack has 120.
		# Default: 700
		# Range: 1 ~ 5000
		inventory_slots = 700
		#Number of upgrade slots in the backpack. The Netherite Backpack has 7.
		# Default: 8
		# Range: 0 ~ 10
		upgrade_slots = 8

	[backpacks.alchemical_brass]
		#Number of inventory slots in the backpack. The Netherite Backpack has 120.
		# Default: 850
		# Range: 1 ~ 5000
		inventory_slots = 850
		#Number of upgrade slots in the backpack. The Netherite Backpack has 7.
		# Default: 9
		# Range: 0 ~ 10
		upgrade_slots = 9

	[backpacks.void_metal]
		#Number of inventory slots in the backpack. The Netherite Backpack has 120.
		# Default: 1000
		# Range: 1 ~ 5000
		inventory_slots = 1000
		#Number of upgrade slots in the backpack. The Netherite Backpack has 7.
		# Default: 10
		# Range: 0 ~ 10
		upgrade_slots = 10

