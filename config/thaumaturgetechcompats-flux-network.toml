[rift_extractor]
	#Ticks between two extractions of a Rift Extractor. Every extraction shrinks the rift by one point.
	# Default: 40
	# Range: 1 ~ 72000
	interval = 40
	#Dimensional Flux a Rift Extractor gets for every point of size it takes from a rift.
	# Default: 5000
	# Range: 1 ~ 2305843009213693951
	flux_per_size = 5000
	#Blocks around the Rift Extractor in which it reaches a flux rift.
	# Default: 6
	# Range: 1 ~ 32
	radius = 6
