[thaumium]
	#Blocks between two Transmission Links of this tier.
	# Default: 16
	# Range: 1 ~ 1024
	link_range = 16
	#Dimensional Flux a Transmission Link of this tier moves every tick.
	# Default: 2000
	# Range: 1 ~ 2305843009213693951
	link_rate_per_tick = 2000
	#Base Dimensional Flux a Storage Core of this tier can hold, before Capacity Cells.
	# Default: 1000000
	# Range: 1 ~ 2305843009213693951
	core_base_capacity = 1000000
	#Radius in blocks in which an Environmental Charger of this tier recharges items.
	# Default: 8
	# Range: 1 ~ 64
	charger_radius = 8
	#Dimensional Flux an Environmental Charger of this tier gives to each item every tick.
	# Default: 200
	# Range: 1 ~ 2305843009213693951
	charger_rate_per_tick = 200

