[thaumium]
	#Capacitor level of the capacitor. The basic capacitor of Ender IO is 1, the double-layer one is 2 and the octadic one is 3. Machines scale their energy capacity, energy use and generation with it.
	# Default: 4.0
	# Range: 0.0 ~ 1000.0
	level = 4.0
	#Capacitor level used only for energy_capacity, instead of the level. 0 uses the level.
	# Default: 0.0
	# Range: 0.0 ~ 1000.0
	energy_capacity = 0.0
	#Capacitor level used only for energy_use, instead of the level. 0 uses the level.
	# Default: 0.0
	# Range: 0.0 ~ 1000.0
	energy_use = 0.0
	#Capacitor level used only for fuel_efficiency, instead of the level. 0 uses the level.
	# Default: 0.0
	# Range: 0.0 ~ 1000.0
	fuel_efficiency = 0.0
	#Capacitor level used only for burning_energy_generation, instead of the level. 0 uses the level.
	# Default: 0.0
	# Range: 0.0 ~ 1000.0
	burning_energy_generation = 0.0
	#Energy the capacitor bank of this level stores per block. Connected banks of the same level add their capacity up, and the bank moves as much energy per tick as it stores. The vibrant capacitor bank of Ender IO stores 4000000. Needs a game restart.
	# Default: 8000000
	# Range: > 1
	bank_capacity = 8000000

