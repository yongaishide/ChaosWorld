[general]
	#Turns the Planetary Endest Pearls off. They stay registered but do nothing when used.
	enabled = true
	#The planets may also pick the thrower as the creature to orbit and hurt.
	include_thrower = false
	#Radius in blocks around a block impact in which the closest creature is picked to be orbited.
	# Default: 6.0
	# Range: 0.5 ~ 64.0
	search_radius = 6.0
	#The planets hurt other players.
	hit_players = true
	#The planets never pick the tamed animals of the thrower.
	spare_pets = true
	#Every planet hit ignores the short invulnerability a creature gets after being hurt, so many planets can hurt together.
	reset_invulnerability = true
	#Fraction of the normal knockback a planet hit applies.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	knockback_scale = 0.1
	#Radius in blocks around a planet in which it hurts creatures when it orbits a point instead of a creature.
	# Default: 1.2
	# Range: 0.1 ~ 8.0
	point_hit_radius = 1.2
	#Most planets that can exist in a dimension at once. A throw is cut short when the limit is reached.
	# Default: 256
	# Range: 1 ~ 100000
	max_active_planets = 256
	#Tiers that kill bosses finish a creature that survives a hit that should have been lethal, such as a boss that is protected while it spawns.
	execute_bosses = true
	#Entity ids that count as bosses besides the c:bosses tag, the Wither and the Ender Dragon.
	extra_boss_entities = []

[visuals]
	#Soft trail particles every planet leaves every tick. 0 turns the trail off.
	# Default: 1
	# Range: 0 ~ 8
	trail_particles = 1
	#Particles when a planet hits.
	hit_particles = true
	#Sounds when planets appear, hit and fade.
	sounds = true
	#Volume of the planet sounds.
	# Default: 0.6
	# Range: 0.0 ~ 4.0
	sound_volume = 0.6
	#Multiplier of the orbital speed of the planets.
	# Default: 1.0
	# Range: 0.1 ~ 8.0
	orbit_speed = 1.0
	#How much the colour of the tier tints the planets. 0 keeps the texture of every planet.
	# Default: 0.55
	# Range: 0.0 ~ 1.0
	tint_strength = 0.55
	#Size multiplier of the planets when they are drawn.
	# Default: 1.0
	# Range: 0.1 ~ 4.0
	planet_scale = 1.0

[copper]
	#Planets a throw summons.
	# Default: 1
	# Range: 1 ~ 12
	planets = 1
	#Damage of every planet hit.
	# Default: 1.0
	# Range: 0.0 ~ 100000.0
	damage = 1.0
	#Ticks between two hits of the same planet.
	# Default: 30
	# Range: 1 ~ 1200
	interval = 30
	#Ticks the planets stay in orbit.
	# Default: 100
	# Range: 20 ~ 72000
	duration = 100
	#Radius in blocks of the orbits, counted from the body of the creature.
	# Default: 1.5
	# Range: 0.5 ~ 32.0
	orbit_radius = 1.5
	#Ticks before the pearl can be thrown again.
	# Default: 60
	# Range: 0 ~ 72000
	cooldown = 60
	#Most damage a planet hit does to a boss. Tiers that kill bosses ignore it.
	# Default: 0.5
	# Range: 0.0 ~ 100000.0
	boss_damage_cap = 0.5
	#Throws the pearl survives. Every throw wears one point and the pearl breaks with the last one.
	# Default: 3
	# Range: 1 ~ 100000
	durability = 3

