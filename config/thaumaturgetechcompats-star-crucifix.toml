[copper]
	#Highest maximum health of a creature this crucifix can bind. Creatures above it are treated as immune and the binding fails. 0 means no limit.
	# Default: 30
	# Range: 0 ~ 1000000
	max_health = 30
	#Distance in blocks at which this crucifix can be used on a creature you are aiming at.
	# Default: 6.0
	# Range: 2.0 ~ 128.0
	range = 6.0
	#Ticks a bound creature hangs in the air before it is dragged underground. Lower is faster. The chains need at least 20 ticks to close.
	# Default: 150
	# Range: 20 ~ 1200
	bind_ticks = 150
	#Whether creatures of the crucifix_immune tag (bosses) are bound and killed instead of resisting and breaking the crucifix.
	kills_bosses = false
	#Uses of the crucifix. Every activation wears one point and the crucifix breaks with the last one. Needs a game restart.
	# Default: 3
	# Range: 1 ~ 100000
	durability = 3

