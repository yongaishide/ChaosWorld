#Base damage dealt by the Data Extractor each cycle.
#数据提取仪每次工作造成的基础伤害。
# Default: 5
# Range: > 0
baseDamage = 5
#Seconds between each Data Extractor damage cycle before speed cards.
#速度卡生效前，数据提取仪每次工作之间的秒数。
# Default: 5
# Range: > 1
workIntervalSeconds = 5
#Base data flow generated by the Data Extractor per cycle.
#数据提取仪每次工作生成的基础数据流。
# Default: 100
# Range: > 0
baseDataFlowPerCycle = 100
#Additional data flow generated per point of sword/base damage.
#每点剑/基础伤害额外生成的数据流。
# Default: 20
# Range: > 0
dataFlowPerSwordDamage = 20
#Base maximum number of target mobs the Data Extractor can affect.
#数据提取仪可影响目标生物数量的基础上限。
# Default: 20
# Range: > 1
baseTargetLimit = 20
#Additional target limit granted by each installed capacity card.
#每张已安装容量卡提供的额外目标上限。
# Default: 5
# Range: > 0
targetLimitPerCapacityCard = 5
#Additional data flow multiplier per extra target. 0.25 = +25% per extra target.
#每个额外目标提供的数据流倍率加成。0.25 表示每个额外目标 +25%。
# Default: 0.25
# Range: 0.0 ~ 1.7976931348623157E308
extraTargetDataFlowMultiplier = 0.25
#Required total damage to complete a mob data carrier after a target is recorded.
#记录目标后，完成生物数据载体所需的总伤害。
# Default: 1024.0
# Range: 1.0 ~ 1.7976931348623157E308
mobRequiredDamage = 1024.0
#Comma-separated entity ids that cannot be recorded into mob data carriers.
#逗号分隔的实体 ID 列表，这些实体不能被记录到生物数据载体中。
mobDataBlacklist = ""
#Required total ore amount to complete an ore data carrier.
#完成矿石数据载体所需的总矿石数量。
# Default: 4096.0
# Range: 1.0 ~ 1.7976931348623157E308
oreRequiredAmount = 4096.0
#Comma-separated item ids that cannot be recorded into ore data carriers.
#逗号分隔的物品 ID 列表，这些物品不能被记录到矿石数据载体中。
oreDataBlacklist = ""
#Required total crop amount to complete a crop data carrier.
#完成农作数据载体所需的总农作数量。
# Default: 4096.0
# Range: 1.0 ~ 1.7976931348623157E308
cropRequiredAmount = 4096.0
#Comma-separated item ids that cannot be recorded into crop data carriers.
#逗号分隔的物品 ID 列表，这些物品不能被记录到农作数据载体中。
cropDataBlacklist = ""
#Comma-separated item ids additionally allowed in the Data Extractor crop slot, even if they do not match the built-in crop rules.
#逗号分隔的额外允许物品 ID 列表，即使不符合内置作物规则也可放入数据提取仪作物槽。
cropDataWhitelist = ""
#Comma-separated crop input mappings in the form input_item=recorded_crop@progress. Example: minecraft:wheat_seeds=minecraft:wheat@0.5
