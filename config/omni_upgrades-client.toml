[BatchInstall]
	#顺序填充模式（默认关闭）。
	#开启：先把一台机器塞满，再塞下一台。
	#关闭：在所有机器之间平均分配插件。
	#游戏中按 Shift+N 切换。
	sequentialFillMode = false
	#对角检测模式（默认关闭）。
	#开启：批量检测会同时检查斜对角的机器（正方形范围扫描）。
	#关闭：只检查直接相邻的机器。
	#游戏中按 Shift+M 切换。
	diagonalDetectionMode = false

[General]
	#总开关（默认开启）。
	#关闭后全能升级完全不工作：批量安装、高亮预览与右键接管全部跳过，
	#把操作交还原版或其他模组。游戏中按 Shift+O 切换，也可直接修改本文件。
	enabled = true

[Blacklist]
	#物品黑名单（客户端，每个玩家独立生效）。
	#列入此名单的物品，全能升级一律不再当升级卡处理：
	#右键拦截与高亮预览全部跳过，把操作交还原版或其他模组。
	#适用于继承 AE2 卡片 API 但并非可安装机器升级的功能卡
	#（例如闪电科技的过载频道卡 'ae2lt:overloaded_frequency_card'）。
	#每行填物品注册 id；以 '#' 开头表示屏蔽整个物品标签
	#（例如 '#ae2:upgrade_cards'）。
	#该名单在进入服务器时同步给服务端；修改后重启游戏生效。
	blacklist = []
