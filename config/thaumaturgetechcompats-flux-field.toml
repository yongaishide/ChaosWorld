[flight_thruster]
	#The Flight Thruster lifts its wearer. Off turns it into a plain chest piece.
	enabled = true
	#Dimensional Flux a Flight Thruster can hold.
	# Default: 200000
	# Range: 1 ~ 2305843009213693951
	capacity = 200000
	#Upward speed in blocks per tick added every tick of thrust.
	# Default: 0.12
	# Range: 0.0 ~ 2.0
	thrust_per_tick = 0.12
	#Highest upward speed in blocks per tick that the thrust alone can reach.
	# Default: 0.45
	# Range: 0.0 ~ 3.0
	max_vertical_speed = 0.45
	#Horizontal speed in blocks per tick added every tick of thrust while the forward key is held.
	# Default: 0.04
	# Range: 0.0 ~ 2.0
	forward_thrust_per_tick = 0.04
	#Highest horizontal speed in blocks per tick that the forward thrust can reach.
	# Default: 0.7
	# Range: 0.0 ~ 3.0
	max_horizontal_speed = 0.7
	#Dimensional Flux used for every second of thrust.
	# Default: 800
	# Range: 0 ~ 2305843009213693951
	cost_per_second = 800
	#Ticks of continuous thrust before the thruster overheats. Keep it under 60: servers kick players that rise for more than 80 ticks in a row.
	# Default: 50
	# Range: 1 ~ 600
	burst_ticks = 50
	#Ticks the thruster stays off after overheating.
	# Default: 10
	# Range: 0 ~ 600
	cooldown_ticks = 10
	#The wearer takes no fall damage while the thruster holds any Dimensional Flux.
	cancel_fall_damage = true
	#The thruster gives out particles from the back of its wearer.
	particles = true
