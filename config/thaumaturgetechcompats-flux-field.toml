[shield_generator]
	#Shield Generators project their barrier. Off turns every Shield Generator into an inert block.
	enabled = true
	#Ticks between two sweeps of the shield bubble for projectiles and monsters. Lower is safer against fast projectiles and costs more performance.
	# Default: 1
	# Range: 1 ~ 20
	scan_interval_ticks = 1
	#The bubble destroys projectiles fired by hostile mobs, such as arrows, fireballs and shulker bullets.
	block_projectiles = true
	#The bubble also destroys projectiles that have no owner, such as those fired by dispensers.
	block_ownerless_projectiles = false
	#The bubble pushes hostile mobs out of its radius. Bosses are never pushed.
	push_monsters = true
	#Horizontal push in blocks per tick that a hostile mob inside the bubble receives on every sweep.
	# Default: 0.35
	# Range: 0.0 ~ 5.0
	push_strength = 0.35
	#Explosions that go off inside the bubble do not destroy the blocks inside it.
	explosion_protect_blocks = true
	#Fraction of the explosion damage that entities inside the bubble do not receive. 1.0 cancels it completely, 0.0 gives no protection to entities.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	explosion_damage_reduction = 1.0
	#A Shield Generator that ran out of Dimensional Flux starts again once it holds the flux of this many ticks of operation, or its whole capacity if that is less.
	# Default: 100
	# Range: 1 ~ 72000
	restart_ticks = 100
	#Radius in blocks around a Shield Generator in which players get the message that it ran out of Dimensional Flux.
	# Default: 32
	# Range: 0 ~ 256
	shutdown_message_radius = 32
	#A shell of particles marks the edge of the bubble. Only players nearby see it.
	particles = true
	#Particles of the shell spawned every time the shell is refreshed.
	# Default: 8
	# Range: 1 ~ 128
	particle_count = 8
	#Ticks between two refreshes of the particle shell.
	# Default: 4
	# Range: 1 ~ 200
	particle_interval_ticks = 4
	#Size of the particles of the shell.
	# Default: 1.0
	# Range: 0.1 ~ 4.0
	particle_scale = 1.0

	[shield_generator.thaumium]
		#Radius in blocks of the bubble of a Shield Generator of this tier.
		# Default: 8
		# Range: 1 ~ 64
		radius = 8
		#Dimensional Flux a Shield Generator of this tier can hold.
		# Default: 100000
		# Range: 1 ~ 2305843009213693951
		capacity = 100000
		#Dimensional Flux a Shield Generator of this tier uses every tick while its bubble is up.
		# Default: 10
		# Range: 0 ~ 2305843009213693951
		cost_per_tick = 10
		#Extra Dimensional Flux for every projectile the bubble destroys.
		# Default: 100
		# Range: 0 ~ 2305843009213693951
		projectile_cost = 100
		#Extra Dimensional Flux for every explosion the bubble absorbs. Without that much flux the explosion goes through and the shield shuts down.
		# Default: 5000
		# Range: 0 ~ 2305843009213693951
		explosion_cost = 5000

