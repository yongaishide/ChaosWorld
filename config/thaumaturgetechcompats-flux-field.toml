[arcane_terraformer]
	#Arcane Terraformers change biomes. Off turns every Arcane Terraformer into an inert block.
	enabled = true
	#Ticks between two work cycles of an Arcane Terraformer.
	# Default: 20
	# Range: 1 ~ 72000
	cycle_interval_ticks = 20
	#Most columns a Terraformer looks at in a single cycle, including those it skips for being already the target biome, blacklisted or in an unloaded chunk.
	# Default: 2048
	# Range: 1 ~ 100000
	max_scanned_per_cycle = 2048
	#Biome baits: an item and the biome it makes a Terraformer paint, as item_id=biome_id. Right-click the Terraformer with the item to load it.
	baits = ["minecraft:sand=minecraft:desert", "minecraft:cactus=minecraft:desert", "minecraft:red_sand=minecraft:badlands", "minecraft:terracotta=minecraft:badlands", "minecraft:snowball=minecraft:snowy_plains", "minecraft:snow_block=minecraft:snowy_plains", "minecraft:packed_ice=minecraft:ice_spikes", "minecraft:grass_block=minecraft:plains", "minecraft:wheat_seeds=minecraft:plains", "minecraft:sunflower=minecraft:sunflower_plains", "minecraft:cornflower=minecraft:flower_forest", "minecraft:oak_sapling=minecraft:forest", "minecraft:birch_sapling=minecraft:birch_forest", "minecraft:dark_oak_sapling=minecraft:dark_forest", "minecraft:spruce_sapling=minecraft:taiga", "minecraft:jungle_sapling=minecraft:jungle", "minecraft:bamboo=minecraft:bamboo_jungle", "minecraft:acacia_sapling=minecraft:savanna", "minecraft:cherry_sapling=minecraft:cherry_grove", "minecraft:mangrove_propagule=minecraft:mangrove_swamp", "minecraft:lily_pad=minecraft:swamp", "minecraft:red_mushroom=minecraft:mushroom_fields", "minecraft:brown_mushroom=minecraft:mushroom_fields", "minecraft:mycelium=minecraft:mushroom_fields", "minecraft:stone=minecraft:windswept_hills", "minecraft:kelp=minecraft:ocean", "minecraft:sea_pickle=minecraft:warm_ocean", "minecraft:dripstone_block=minecraft:dripstone_caves", "minecraft:glow_berries=minecraft:lush_caves", "minecraft:sculk=minecraft:deep_dark", "minecraft:netherrack=minecraft:nether_wastes", "minecraft:crimson_nylium=minecraft:crimson_forest", "minecraft:warped_nylium=minecraft:warped_forest", "minecraft:soul_sand=minecraft:soul_sand_valley", "minecraft:basalt=minecraft:basalt_deltas", "minecraft:end_stone=minecraft:the_end"]
	#Biomes that a Terraformer never overwrites and never paints.
	biome_blacklist = ["thaumaturge:tainted_lands", "thaumaturge:eldritch", "thaumaturge:eerie"]
	#Dimensions in which a Terraformer does nothing.
	dimension_blacklist = ["minecraft:the_end", "thaumaturge:outer_lands"]
	#A Terraformer at work gives out particles.
	particles = true

